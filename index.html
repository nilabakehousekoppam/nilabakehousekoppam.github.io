<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Coexistence Setup</title>
</head>
<body>
  <h2>WhatsApp Cloud API + Mobile App Setup</h2>
  <p>Click below to launch Meta's Embedded Signup and link your mobile app number.</p>

  <!-- Facebook Login Button -->
  <button onclick="launchWhatsAppSignup()" style="background:#1877f2;color:white;padding:12px 20px;border:none;border-radius:6px;font-size:16px;cursor:pointer;">
    Connect WhatsApp Number
  </button>

  <script>
    // 1. Initialize Facebook SDK
    window.fbAsyncInit = function() {
      FB.init({
        appId      : '1627831575745993', // Replace with your App ID from Meta Developer Console
        cookie     : true,
        xfbml      : true,
        version    : 'v19.0'
      });
    };

    // Load Facebook SDK Async
    (function(d, s, id){
       var js, fjs = d.getElementsByTagName(s)[0];
       if (d.getElementById(id)) {return;}
       js = d.createElement(s); js.id = id;
       js.src = "https://connect.facebook.net/en_US/sdk.js";
       fjs.parentNode.insertBefore(js, fjs);
     }(document, 'script', 'facebook-jssdk'));

    // 2. Launch Embedded Signup Popup
    function launchWhatsAppSignup() {
      FB.login(function(response) {
        if (response.authResponse) {
          console.log('Successfully connected!', response);
          alert('Setup complete! Check your browser console for authorization details.');
        } else {
          console.log('User cancelled or did not fully authorize.');
        }
      }, {
        // Request the WhatsApp management permissions
        scope: 'whatsapp_business_management, whatsapp_business_messaging',
        extras: {
          feature: 'whatsapp_embedded_signup'
        }
      });
    }
  </script>
</body>
</html>
